version: '3.8'

services:
  backend:
    build: .
    container_name: lore-engine
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./library_db:/app/library_db
      - ./vote.db:/app/vote.db
    restart: unless-stopped

  discord-bot:
    build: .
    container_name: lore-engine-bot
    command: python src/lore-engine.py
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./library_db:/app/library_db
      - ./vote.db:/app/vote.db
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: lore-engine-site
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lore-engine-tunnel
    command: tunnel --no-autoupdate run --token CLOUDFLARE_TUNNEL_TOKEN
    depends_on:
      - frontend
    restart: unless-stopped